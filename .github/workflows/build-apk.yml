
name: Build Saraswti Mobile APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          api-level: 33
          build-tools: "33.0.2"
          components: "platform-tools,cmdline-tools;latest"

      - name: Build APK
        run: |
          if [ ! -f ./gradlew ]; then
            echo "ERROR: gradlew file is missing from repository root."
            exit 1
          fi
          chmod +x ./gradlew
          ./gradlew :app:assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Saraswti-Mobile-APK
          path: app/build/outputs/apk/debug/app-debug.apk
